name: Compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  workspace:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest@0.9.152
      - run: cargo fmt --all --check
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked --workspace --profile=ci
      - run: cargo nextest run --locked --workspace --all-features --profile=ci
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-machete@0.10.1,cargo-deny@0.22.2
      - run: cargo machete
      - run: python3 scripts/check-dependencies.py

  public-api:
    name: Public Rust API
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-semver-checks@0.51.0
      - name: Compare the workspace API with the base revision
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: cargo semver-checks --workspace --all-features --baseline-rev "$BASE_REVISION"

  consumer:
    name: Zinder wallet consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ZcashFoundation/zinder
          ref: 536c66e1675725f38724e843ce36eeb8eb039559 # v0.28.0
          path: zinder
          sparse-checkout: scripts/wallet-clients
          persist-credentials: false
      - run: cargo fetch --locked
      - name: Compile the external consumer against this checkout
        run: |
          python3 zinder/scripts/wallet-clients/zally-payment.py \
            --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/zally-consumer" build

  testnet-reads:
    name: Public Testnet reads
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest@0.9.152
      - name: Read the reorg window and a settled compact-block range
        env:
          ZALLY_TEST_LIVE: "1"
          ZALLY_NETWORK: testnet
          ZINDER_ENDPOINT: https://testnet.zinder.zfnd.org:443
        run: |
          cargo nextest run --locked -p zally-chain --features zinder \
            --test live_zinder_source --profile=ci-live --run-ignored=only --no-tests=fail
